name: Helm Chart CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      chart_path:
        description: Path to the Helm chart
        required: true
        default: charts/my-chart
        type: string

permissions:
  contents: read

env:
  CHART_PATH: ${{ inputs.chart_path || 'charts/my-chart' }}

jobs:
  validate:
    name: Lint and template chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint "$CHART_PATH"
      - name: Render templates
        run: helm template release "$CHART_PATH" --output-dir .rendered
      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: .rendered

  package:
    name: Package chart
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Package chart
        shell: bash
        run: |
          mkdir -p dist
          helm dependency update "$CHART_PATH"
          helm package "$CHART_PATH" --destination dist
      - name: Upload chart package
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz

  publish:
    name: Publish chart
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download chart package
        uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz